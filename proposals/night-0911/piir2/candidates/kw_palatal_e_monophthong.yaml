# Candidate: *kʷ > *č before a monophthongal *e.
# The wider claim (before any *e) gains the same four words and costs Middle
# Persian kyš (PIE *kʷeys- > PII *kayšás > pal kēš, cf. Skt. keśa-, whose *k
# the handbooks leave unexplained): see kw_palatal_e.yaml.
rules:
  - id: labiovelar_k_palatal_e
    order: 44
    name: "*kʷ > *č before a monophthongal *e"
    match: kʷ
    replace: č
    env:
      right: (ˈ|ˌ)? e (!GLIDE|#)
    tier: proposed
    references: [mayrhofer-1986]
    description: >
      The labiovelar palatalises before the front vowel *e: *pénkʷe > *pánče,
      *kʷetwóres > *čatwā́ras, *kʷélh₁eti > *čárHati.  It is the *diphthong*
      *ey that blocks the change: PIE *kʷeys- keeps its *k (PII *kayšás,
      Middle Persian kēš, Skt. keśa-).  A plain *k before *e is not in the
      environment either (PIE *ker > OP kāra-), which is why the rule runs
      before the labiovelar merger and names *kʷ, not *k.
    examples:
      - {in: "*pénkʷe", out: "*pénče", gloss: "five"}
      - {in: "*kʷetwóres", out: "*četwóres", gloss: "four"}
      - {in: "*kʷeys", out: "*kʷeys", gloss: "hair — the *ey diphthong blocks it (Skt. keśa-)"}
