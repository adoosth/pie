rules:
- id: c4_ei_to_i_all
  order: 213
  name: '*ei > *ī'
  match: e i
  replace: ī
  tier: established
  description: The diphthong *ei monophthongises to *ī (*eizā > *īzā, *deiwos > *dīwos).
  references:
  - sihler-1995
  - weiss-2009
  examples:
  - in: '*eizā'
    out: '*īzā'
    gloss: anger
