# iir-pro -> ira-pro candidates, 2026-11-09.
#
# SHIPPED: laryngeal_after_t (as `laryngeal_after_t`, tier proposed, order 117 in
# data/rules/iir-pro__ira-pro.yaml).  Measured (council, layers
# exact,orthographic,cited,script,identity,bound): +3 ira-pro (názdištah,
# kácištah, bárjištah), nothing lost in ira-pro, ave, peo, pal or fa.
#
# REJECTED: geminate_tt (*kúttas > *kútah).  Measured +1 ira-pro, nothing lost,
# but one etymon is below the three-etymon bar and a geminate is the sort of
# claim that needs a second word before it may enter data/rules/.
#
# The pair was first measured together: +4 ira-pro, 0 lost.
rules:
  - id: geminate_tt
    order: 108
    name: "PII *-tt- > PIr *-t-"
    match: t t
    replace: t
    tier: proposed
    references: [hoffmann-forssman-2004]
    description: "*kúttas > *kútah."
    examples:
      - {in: "*kúttas", out: "*kútas", gloss: "how much (PIr *kútah)"}
  - id: laryngeal_after_t
    order: 117
    name: "PII *H > PIr ∅ between *t and a vowel"
    match: H
    replace: ""
    env: {left: t, right: "(a|ā|i|ī|u|ū|e|o)"}
    tier: proposed
    references: [hoffmann-forssman-2004]
    description: "*názdištHas > *názdištas > *názdištah."
    examples:
      - {in: "*názdištHas", out: "*názdištas", gloss: "nearest"}
