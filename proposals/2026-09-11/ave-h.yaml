# Candidate measured for Avestan: the word-initial laryngeal is lost.
# The Old Persian stage already carries this rule (ira-pro__peo.yaml, order 2);
# the Avestan stage did not, although its own laryngeal_lengthening note said a
# word-initial *H "is handled by the older rule that names it".  Measured with
#
#   PYTHONPATH=src python3 tools/whatif.py --from ira-pro --to ave --rules proposals/2026-09-11/ave-h.yaml --layers exact,orthographic
#     explained before: 5   after: 7  (+2: 𐬀𐬞, 𐬁𐬙𐬀𐬭)   lost: 0
#
# and installed (the same block now sits in data/rules/ira-pro__ave.yaml, so
# re-measure it there with `whatif --to ave --drop laryngeal_loss_initial`).
rules:
  - id: laryngeal_loss_initial
    order: 2
    tier: established
    name: "PIr *H- is lost at the start of a word"
    match: H
    replace: ""
    env: {left: "#"}
    description: >
      Avestan loses the Proto-Iranian laryngeal as Old Persian does, and a
      word-initial one leaves nothing behind because there is no vowel before it
      to lengthen: PIr *Hanyah > Av. aniia- 'other', *Háyšmah > aēšma- 'fury',
      *Hŕ̥šah > arša- 'bear'.
    references: [hoffmann-forssman-2004, skjaervo-2009]
    examples:
      - {in: "*Hanyah", out: "*anyah", gloss: "other (Av. aniia-)"}
      - {in: "*Hŕ̥šah", out: "*ŕ̥šah", gloss: "bear (Av. arša-)"}
