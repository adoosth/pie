stage:
  name: Proto-Italic → Latin (candidate 4)
  references:
  - sihler-1995
  - weiss-2009
  - meiser-1998
rules:
- id: v_len_e_s
  order: 149
  name: e lengthens before lost *s
  match: e
  replace: ē
  env:
    right: s (b|d|g|m|n|l|r)
  tier: established
  description: Compensatory lengthening when *s is lost before a voiced consonant.
  references:
  - sihler-1995
  examples:
  - in: '*nesdo'
    out: '*nēsdo'
    gloss: x
