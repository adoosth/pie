stage:
  name: Proto-Italic → Latin (candidate 4)
  references:
  - sihler-1995
  - weiss-2009
  - meiser-1998
rules:
- id: v_len_a_s
  order: 149
  name: a lengthens before lost *s
  match: a
  replace: ā
  env:
    right: s (b|d|g|m|n|l|r)
  tier: established
  description: Compensatory lengthening when *s is lost before a voiced consonant.
  references:
  - sihler-1995
  examples:
  - in: '*nasdo'
    out: '*nāsdo'
    gloss: x
