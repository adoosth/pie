    basis: dictionary
    quote: "Fjalori, i cili do të përmbajë rreth 120 mijë fjalë, do të vijë fillimisht në formatin virtual nga interneti, ndërsa në vitin 2025 do të vijohet edhe me procesin e printimit."

  - lang: pal
    total: 4000
    source: "D. N. MacKenzie, A Concise Pahlavi Dictionary (OUP 1971), preface"
    url: "https://www.parsianjoman.org/wp-content/uploads/2015/09/A-Concise-Pahlavi-Dictionary.pdf"
