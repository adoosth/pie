    counts: "entries (headwords) of literary and documentary Ancient Greek"
    basis: dictionary
    quote: "The LSJ main edition has 116,502 entries."

  - lang: sa
    total: 180000
    source: "M. Monier-Williams, A Sanskrit–English Dictionary (1899), publisher's description"
    url: "https://books.google.com/books/about/Sanskrit_English_Dictionary.html?id=rhRhAQAACAAJ"
    year: 1899
    counts: "words (the dictionary's own headword count)"
    basis: dictionary
