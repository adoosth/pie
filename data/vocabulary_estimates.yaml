  - lang: ave
    total: 7959
    source: "Chr. Bartholomae, Altiranisches Wörterbuch (1904), digitised as the CAB edition (FU Berlin)"
    url: "https://cab.geschkult.fu-berlin.de/dictionaries/Bartholomae_Dictionary.html"
