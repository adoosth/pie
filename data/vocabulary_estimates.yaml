  - lang: lt
    total: 500000
    source: "Lietuvių kalbos žodynas (LKŽ, 20 volumes), described on Lithuanian Wikipedia"
    url: "https://lt.wikipedia.org/wiki/Lietuvi%C5%B3_kalbos_%C5%BEodynas"
    year: 2002
    counts: "leksikografiniai straipsniai (lexicographic articles), dialect vocabulary included, quoted 1547–2001"
    basis: upper
    quote: "Žodyno apimtis: apie 22 000 puslapių, 0,5 mln. leksikografinių straipsnių."

  - lang: sq
    total: 120000
    source: "Fjalori i madh i gjuhës shqipe (2024), reported by fjala.info"
    url: "https://fjala.info/ne-nentor-2024-publikohet-fjalori-me-i-madh-i-gjuhes-shqipe-fillimisht-ne-internet/"
