# Old Church Slavonic in its own letters: what each sign writes.
#
# This is not a sound law and not an orthographic rule.  It is the writing
# system itself: the relationship between a headword a manuscript writes (вода)
# and the reading a dictionary gives it (voda).  Old Church Slavonic is written
# in an alphabet — every vowel and consonant has its own letter, and the letters
# are read one by one — so the alignment here is the strictest in the repo: one
# sign stands for one letter of the reading, and no letter of the reading and no
# sign may be left over.  The values are the transliteration the record itself
# uses (ъ = ŭ, ь = ĭ, ѣ = ě, ѫ = ǫ, ѧ = ę, ы = y, щ = št, ж = ž, ч = č,
# ш = š, ц = c), which is also the transliteration of Schenker (1995), Carlton
# (1991), Lunt (1974) and Huntley (in Comrie & Corbett 1993), with the letter
# values of Vaillant (Manuel du vieux slave I, 1950, §§1-8).
#
# Four limits are stated here rather than papered over, because each of them
# makes a word a miss and none of them may be hidden:
#
# * **The matcher reads one sign for one letter.**  The yus letters ѩ, ѭ and the
#   iotified ю, ѥ, ꙗ are j + vowel and the matcher can still align them (the
#   sign's value carries both, as a cv sign does in the Old Persian table), but
#   five signs write two *consonants* and cannot be aligned: щ (št, 71
#   headwords), ѕ/ꙃ (dz, 15), ꙉ (dž) and the Greek loans ѯ (ks), ѱ (ps); the
#   capital Ѯ and the Glagolitic ⰷ ⱋ ⱜ behave the same way.  Those words
#   are misses in the script column, reported as such.
# * **The digraph оу writes one vowel.**  /u/ is written with two signs, and the
#   matcher has one letter to spend on them; a word spelled оу is a miss unless
#   the laws happen to write it with two letters, which they may not do.
# * **Diacritics are folded.**  The aligner compares base letters, so ѣ and е
#   are one letter, ѫ and о one, ѧ and е one.  The table cannot tell the jat'
#   from the e, and a wrong vowel of the same letter class would pass.  This is
#   the same fold the Persian table states for ā/a, and it is why the matches
#   are counted in the script column and never in the historical one.
# * **Glagolitic is the same script in another hand.**  The 11 headwords the
#   record writes in Glagolitic are listed with the values of the Cyrillic
#   letters they correspond to (Vaillant 1950, §§5-8; Schenker 1995, 169-171).
stage:
  id: chu
  name: Old Church Slavonic, Cyrillic and Glagolitic
  description: >
    An alphabet.  Each letter writes one segment; the yers ъ ь write the two
    ultra-short vowels, the yuses ѧ ѫ the two nasal vowels, ѣ the jat', and щ
    the cluster /št/.  The iotified letters ѥ ѩ ѭ ю ꙗ are j plus a vowel, and
    one sign therefore writes two letters of the reading.  Nothing here is a
    pronunciation: the values are the dictionary's transliteration, not an IPA.
  references: [vaillant-1950, meillet-1934, shevelov-1964]

