conventions:
  - id: one_letter_one_segment
    name: "an alphabet: every sign writes one letter of the reading"
    kind: letter
    note: >
      Old Church Slavonic is written alphabetically, so the alignment is
      strict: a sign the reading does not fill is a miss and a reading letter
      the signs do not write is a miss (Vaillant 1950, §§1-8; Carlton 1991,
      ch. 1).  The only exception the matcher states for itself is the
      word-final /h/ it never requires, which no Slavic word needs.
  - id: iotified_signs
    name: "ѥ ю ꙗ ѩ ѭ write j plus a vowel in one sign"
    kind: letter
    note: >
      The iotified letters are one sign for two letters of the reading.  The
      matcher aligns them because a cv sign may carry its own vowel; a sign
      with two consonants (щ ѕ ꙃ ѯ ѱ) cannot be aligned and its words are
      reported as misses.
  - id: yers_are_vowels
    name: "ъ and ь write the two ultra-short vowels, transliterated ŭ and ĭ"
    kind: letter
    note: >
      The yers are vowels phonologically and letters of the alphabet: ь is read
      ĭ and ъ ŭ in the dictionaries' transliteration (Schenker 1995, 71-74;
      Lunt 1974, 24-30).  They are written wherever the record writes them;
      the table never supplies a vowel the letters do not carry.
  - id: digraph_ou
    name: "the vowel /u/ is written оу with two signs"
    kind: letter
    note: >
      The digraph оу writes one vowel (Vaillant 1950, §9; Carlton 1991, 118).
      A one-sign-one-letter matcher cannot spend one letter on two signs, so a
      headword spelled оу is a miss unless the laws write it as two letters;
      those words are listed with the residue.
  - id: diacritics_folded
    name: "the aligner compares base letters, so ѣ/е, ѫ/о and ѧ/е are one letter each"
    kind: fold
    note: >
      The matcher drops combining marks, so the jat', the yuses and the plain
      vowels of the same base letter are indistinguishable to it.  This is a
      limit of the measurement, stated here; the matches it produces are
      counted in the script column and never in the historical one.
