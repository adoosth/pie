  # ---- the dictionary's own notation: Book Pahlavi in Latin letters -------
  # MacKenzie prints every Pahlavi spelling in a Latin transliteration beside
  # the transcription, one letter per sign (Table II, "Transliteration",
  # pp. x-xii).  That notation is a *rendering of the same signs*, not a
  # pronunciation, so it is read by the same alignment: every letter must be
  # one the sign can stand for, and no short vowel is written.  The values are
  # the sign's, restated in the letter that renders it, because MacKenzie's
  # system "gives each letter ... its basic Iranian value(s)" and deliberately
  # stops there: "it is neither necessary nor desirable to go beyond this by
  # attempting to give closer 'phonetic' values to the letters, such as r for
  # written l, or x for written h" (Introduction, "Transliteration").  Hence
  # the letter l is read l or r and the letter h is read h or x, exactly as
  # the signs they render are.  Ideograms are transliterated in capitals
  # (ŠM, LWTE) and are read as whole words from data/readings_pal.json, never
  # letter by letter, so no capital is listed here.
  - {char: "ʾ", letter: "ALEPH", sounds: ["ʾ", "ā", "a"], kind: translit, note: "Table II, aleph; writes ā and the seat of an initial vowel"}
  - {char: "b", letter: "BETH", sounds: ["b"], kind: translit, note: "Table II, beth"}
  - {char: "g", letter: "GIMEL", sounds: ["g"], kind: translit, note: "Table II, gimel"}
  - {char: "d", letter: "DALETH", sounds: ["d"], kind: translit, note: "Table II, daleth"}
  - {char: "h", letter: "HE-HETH", sounds: ["h", "x"], kind: translit, note: "he and heth are both transliterated h; read x when the sign is heth"}
  - {char: "w", letter: "WAW", sounds: ["w", "ō", "ū", "u", "r", "ʿ"], kind: translit, note: "waw-ayin-resh, the polyphony of 𐭥"}
  - {char: "z", letter: "ZAYIN", sounds: ["z"], kind: translit, note: "Table II, zayin"}
  - {char: "ḥ", letter: "HETH", sounds: ["h", "x"], kind: translit, note: "heth written with its Aramaic value"}
  - {char: "y", letter: "YODH", sounds: ["y", "ē", "ī", "i"], kind: translit, note: "yodh writes y, ē and ī"}
  - {char: "k", letter: "KAPH", sounds: ["k", "g"], kind: translit, note: "kaph writes k and g"}
  - {char: "l", letter: "LAMEDH", sounds: ["l", "r"], kind: translit, note: "lamedh writes l and r; MacKenzie insists on l in the transliteration"}
  - {char: "m", letter: "MEM", sounds: ["m", "q"], kind: translit, note: "mem-qoph"}
  - {char: "n", letter: "NUN", sounds: ["n"], kind: translit, note: "Table II, nun"}
  - {char: "s", letter: "SAMEKH", sounds: ["s"], kind: translit, note: "Table II, samekh"}
  - {char: "p", letter: "PE", sounds: ["p", "b", "f"], kind: translit, note: "pe writes p, b (printed p̄) and f"}
  - {char: "c", letter: "SADHE", sounds: ["c", "z", "j"], kind: translit, note: "sadhe writes c, č, z and j"}
  - {char: "š", letter: "SHIN", sounds: ["s"], kind: translit, note: "Table II, shin"}
  - {char: "ʿ", letter: "AYIN", sounds: ["ʿ", "w", "r"], kind: translit, note: "ayin, a value of 𐭥"}
  - {char: "č", letter: "SADHE-CARON", sounds: ["c", "z", "j"], kind: translit, note: "sadhe read č; the same sign as c"}
  - {char: "ẕ", letter: "ZAYIN-DOT", sounds: ["z"], kind: translit, note: "the dotted zayin of the later books, read z"}
  - {char: "t", letter: "TAW", sounds: ["t", "d"], kind: translit, note: "taw writes t and d"}
