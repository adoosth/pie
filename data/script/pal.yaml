# Middle Persian: the two scripts that write it, and what each sign says.
#
# This is not a sound law and not an orthographic rule: it is the writing
# system itself, the relationship between a headword a manuscript writes and
# the sounds a reader gives it.  Middle Persian is written in two scripts with
# different properties, and the table keeps them apart by ``kind``:
#
# * Book / Inscriptional Pahlavi (``kind: pahlavi``) is an Aramaic-derived
#   abjad.  It writes consonants only: the short vowels a i u are not written
#   at all, and three of its letters stand for more than one Aramaic letter
#   (𐭥 WAW-AYIN-RESH, 𐭬 MEM-QOPH, and the polyphony of 𐭡/𐭯/𐭪/𐭲 for
#   b/p, p/b/f, k/g, t/d).  A Pahlavi spelling therefore *underdetermines* the
#   vowels: ``sng`` writes sang, sing and sung alike, and a reading is
#   possible when every sign's sound is one of the sounds the reading has.
#   The values are MacKenzie's (A Concise Pahlavi Dictionary, 1971): the
#   letter inventory is the Aramaic one, and the sounds are the ones his own
#   transcriptions give the letters.
#
# * Manichaean (``kind: manichaean``) is alphabetic and writes the long
#   vowels with ʾ, y and w (ā, ē/ī, ō/ū), so it underdetermines less: a
#   reading must be able to give every sign one of its sounds (Durkin-
#   Meisterernst, Grammatik des Westmitteliranischen, 2014).
#
# * The transliteration (``kind: translit``) is the notation MacKenzie prints
#   the spellings in: one Latin letter per sign, in capitals for the Aramaic
#   ideograms (ŠM, LWTE), lowercase for the Iranian spellings (ʾp̄ʾt', gwlg).
#   It is a rendering of the same signs and not a pronunciation, so it is read
#   by the same alignment; the last block of this file restates each sign's
#   values in the letter that renders it (Table II, and the note that the
#   system stops at the basic Iranian value: "such as r for written l, or x
#   for written h" is deliberately not written).
#
# Signs the corpus does not use are not listed: every row here is exercised by
# at least one recorded Middle Persian form (a glossary headword or a form a
# descendant's ancestry records), and tests/test_pal_script.py fails on a sign
# that no recorded word writes.
stage:
  id: pal
  name: Middle Persian (Book Pahlavi and Manichaean)
  description: >
    Aramaic-derived abjads.  Book Pahlavi writes the consonants and leaves the
    short vowels unwritten, and several letters are polyphonic (𐭥 is w, r or
    ʿ; 𐭬 is m or q; 𐭪 is k or g), so a spelling is read only up to its
    consonants.  A word may also be written as an Aramaic ideogram (a
    heterogram: ZNE "this", LHMA "bread") and read as the Middle Persian word
    it stands for; that reading is a lexical fact of the dictionary, not a
    value of the signs, so heterograms live in the reading table
    (data/readings_pal.json) and never in this one.  The Manichaean script is
    alphabetic and marks the long vowels.
  references: [mackenzie-1971, durkin-meisterernst-2014]

conventions:
  - id: short_vowels_unwritten
    name: "a short vowel (a i u) is not written"
    kind: unwritten
    note: >
      Book Pahlavi writes no short vowel: sng is sang/sing/sung, and a reading
      may supply any short vowel between the signs.  The convention is what the
      matcher uses; it never invents a vowel of its own.
  - id: final_silent_letter
    name: "a final letter marked with an apostrophe is written but not read"
    kind: silent
    mark: "\u0027"
    note: >
      MacKenzie's transliteration closes many spellings with an apostrophe
      (swk', gwlbk'); the letter is graphic, not pronounced, and a reading that
      stops before it is still a reading of the spelling.

signs:
  - {char: "𐫀", letter: "ALEPH", sounds: ["ʾ", "ā", "a"], kind: manichaean}
  - {char: "𐫁", letter: "BETH", sounds: ["b"], kind: manichaean}
  - {char: "𐫃", letter: "GIMEL", sounds: ["g"], kind: manichaean}
  - {char: "𐫅", letter: "DALETH", sounds: ["d"], kind: manichaean}
  - {char: "𐫆", letter: "HE", sounds: ["h"], kind: manichaean}
  - {char: "𐫇", letter: "WAW", sounds: ["w", "ō", "ū"], kind: manichaean}
  - {char: "𐫉", letter: "ZAYIN", sounds: ["z"], kind: manichaean}
  - {char: "𐫍", letter: "HETH", sounds: ["h", "x"], kind: manichaean}
  - {char: "𐫏", letter: "YODH", sounds: ["y", "ē", "ī"], kind: manichaean}
  - {char: "𐫐", letter: "KAPH", sounds: ["k", "g"], kind: manichaean}
  - {char: "𐫓", letter: "LAMEDH", sounds: ["l", "r"], kind: manichaean}
  - {char: "𐫖", letter: "MEM", sounds: ["m"], kind: manichaean}
