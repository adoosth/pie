# Persian (New Persian) in the Perso-Arabic script: what each letter says.
#
# This is not a sound law and not an orthographic rule.  It is the writing
# system itself: the relationship between a headword a text writes (خانه) and
# the sounds a reader gives it (xāne).  Persian is written in an abjad: it
# writes the consonants, the long vowels ā ī ū, and the two word-final short
# vowels -a and -e (with ه), and it leaves the short vowels a e o (and short
# i u) unwritten in the body of a word.  A spelling is therefore read only up
# to its letters, and the matcher gives every sign one letter of the reading
# in order, and lets an unwritten short vowel cost no sign.  Two leniencies
# are the matcher's, not the script's and not this table's: length is folded
# (ā and a are one letter, so نام cannot tell nām from nam), and an unwritten
# short vowel of the reading may pass a written sign unspent.  Both are
# inherited from the Middle Persian table and are stated in the report; the
# count they produce is kept in its own column and never in the historical
# figure.
#
# The values are Thackston's letter inventory (An Introduction to Persian,
# 1993, §1–3) and the phoneme correspondences of Windfuhr (1979) and the
# Iranian Languages handbook (2009).  The Arabic letters that Persian keeps for
# loans (ث ص ض ط ظ ح ذ ع) write the same sounds as their Persian counterparts,
# so a sign may stand for more than one phoneme's letter: the table records
# what the script distinguishes, not what the language does.  Length is
# writing, not a letter, so the matcher folds ā/ī/ū to a/i/u; a sign's
# `sounds` are therefore written in that folded alphabet, while `value` keeps
# the dictionary's transliteration for the page.
#
# Two limits are stated rather than papered over.  A written letter is never
# silent here: the و of خواب is read /w/ (classical xwāb) and its loss in the
# modern /xāb/ is a sound change (pal__fa xw_to_x_initial), so a reading with
# no /w/ does not fit the spelling — the correct spelling is still produced
# from the phonemic xwāb, which is the direction the spelling layer runs.  A
# final -ow (نو now) writes one letter و for two segments and is likewise a
# miss, not a licence to drop the glide.  The script layer's alphabet also
# folds š/ž to s/z (the same fold the Middle Persian table undergoes), so it
# cannot tell س from ش; matches are reported in their own column and audited,
# never added to the historical figure.
stage:
  id: fa
  name: Persian (New Persian), Perso-Arabic script
  description: >
    An abjad.  Consonants and the long vowels ā ī ū are written; the short
    vowels a e o (and short i u) are left to the reader.  Word-initially a
    vowel takes ا as its seat (and ā takes آ); word-finally -a and -e are
    written ه.  The Arabic letters kept for loans write the same sounds as
    their Persian counterparts, so the spelling underdetermines the phoneme
    exactly as it underdetermines the short vowels.
  references: [thackston-1993, windfuhr-2009]

signs:
  - {char: "ا", letter: "ALEF", value: "ā", sounds: ["ʾ", "a", "e", "i", "o", "u"], kind: abjad, note: "word-initial seat for any vowel; medial and final ā"}
  - {char: "آ", letter: "ALEF_MADDA", value: "ā", sounds: ["a", "ʾ"], kind: abjad, note: "word-initial ā"}
  - {char: "ب", letter: "BE", value: "b", sounds: ["b"], kind: abjad}
  - {char: "پ", letter: "PE", value: "p", sounds: ["p"], kind: abjad}
  - {char: "ت", letter: "TE", value: "t", sounds: ["t"], kind: abjad}
  - {char: "ث", letter: "THE", value: "s", sounds: ["s"], kind: abjad, note: "Arabic letter, read /s/"}
  - {char: "ج", letter: "JIM", value: "ǰ", sounds: ["j"], kind: abjad}
  - {char: "چ", letter: "CHE", value: "č", sounds: ["c"], kind: abjad}
  - {char: "ح", letter: "HE_HET", value: "h", sounds: ["h"], kind: abjad, note: "Arabic letter, read /h/"}
  - {char: "خ", letter: "KHE", value: "x", sounds: ["x"], kind: abjad}
  - {char: "د", letter: "DAL", value: "d", sounds: ["d"], kind: abjad}
  - {char: "ذ", letter: "DHAL", value: "z", sounds: ["z"], kind: abjad, note: "Arabic letter, read /z/"}
  - {char: "ر", letter: "RE", value: "r", sounds: ["r"], kind: abjad}
  - {char: "ز", letter: "ZE", value: "z", sounds: ["z"], kind: abjad}
  - {char: "ژ", letter: "ZHE", value: "ž", sounds: ["z"], kind: abjad}
