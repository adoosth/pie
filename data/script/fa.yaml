  - {char: "ي", letter: "ARABIC_YE", value: "y", sounds: ["j", "i", "e"], kind: abjad, note: "Arabic spelling of ی"}
  - {char: "ك", letter: "ARABIC_KAF", value: "k", sounds: ["k"], kind: abjad, note: "Arabic spelling of ک"}

conventions:
  - id: short_vowels_unwritten
    name: "a short vowel (a e o, and short i u) is not written in the body of a word"
    kind: unwritten
    note: >
      The abjad writes no short vowel: پدر is pidar, سر sar, گوش gūš.  A
      reading may supply any short vowel between the signs; the matcher uses
      this and never invents one (Thackston 1993 §2).
  - id: initial_vowel_seat
    name: "a word-initial vowel is carried by alef (and ā by آ)"
    kind: unwritten
    note: >
      ابر abr, اسم esm, امید omīd: the letter is the seat, the quality is the
      reader's.  This is why ا may stand for any vowel in the table.
  - id: final_short_vowel_written
    name: "word-final -a and -e are written with ه"
    kind: letter
    note: >
      خانه xāne, ده de, نه na: the place a short vowel is normally written.
      The table writes the letter, but the alignment cannot *require* it: the
      matcher's trailing-vowel rule (inherited from the syllabary) lets a
      word-final short vowel stay unwritten, so خان is also accepted as a
      reading of xāne.  That is a limit of the alignment, not a licence to
      drop the letter when spelling.
  - id: shadda_is_a_mark
    name: "a shadda marks gemination and writes no letter of its own"
    kind: unwritten
    note: >
      A geminate consonant is written once with the mark U+0651 over it
      (مُدَرِّس).  The mark is not a sign: the alignment ignores combining
      marks, so the doubled consonant costs one letter, not two
      (Thackston 1993 §1).
  - id: historic_waw
    name: "خوا writes historic *xw-: و is read /w/ (xwāb) and is graphic in the modern /xāb/"
    kind: historic
    note: >
      خواب xwāb, خواهر xwāhar, خواندن xwāndan keep the Middle Persian *w in
      the spelling.  The modern Tehrani reading /xāb/ drops it by sound change,
      not by a reading convention, so a reading with /w/ fits the signs and a
      reading without it does not (Windfuhr 1979, 2009).
  - id: tanwin_and_marks
    name: "the Arabic tanwīn and vowel marks are marks, not letters"
    kind: unwritten
    note: >
      A loan may be written with ً ٌ ٍ (tanwīn) or the short-vowel marks; none
      of them writes a letter, and the alignment ignores them.
