stage:
  name: Old English orthography
  description: >
    How Old English is written.  The letters c and þ are the two conventions that
    matter for this corpus: /k/ is written c (storc for 'stork'), and the dental
    fricative is written þ.  Vowel length is marked in grammars but not in the
    dictionary's lemmas, so the macron is mapped away here as well.
  references: [campbell-1959, wright-1908]

rules:
  - id: k_to_c
    order: 10
    name: "/k/ is written ⟨c⟩"
    match: k
    replace: c
    tier: orthographic
    description: "Old English writes the velar stop with c in every position; k appears only in a handful of late or foreign spellings."
    references: [campbell-1959]
    examples:
      - {in: "stork", out: "storc"}
  - id: theta_to_thorn
    order: 11
    name: "/θ/ is written ⟨þ⟩"
    match: θ
    replace: þ
    tier: orthographic
    references: [campbell-1959, wright-1908]
    examples:
      - {in: "θing", out: "þing"}
  - id: len_101
    order: 100
    name: "Long ⟨ā⟩ is written ⟨a⟩"
    match: "ā"
    replace: "a"
    tier: orthographic
    description: "The phonemic layer marks vowel length with a macron; this stage's dictionary writes the plain letter and leaves length to context, so the comparison has to be made in the dictionary's notation."
    references: [campbell-1959]
    examples:
      - {in: "ām", out: "am"}
  - id: len_113
    order: 101
    name: "Long ⟨ē⟩ is written ⟨e⟩"
    match: "ē"
    replace: "e"
    tier: orthographic
