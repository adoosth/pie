stage:
  name: Modern Greek orthography (monotonic)
  date_start: 1982
  date_end: null
  description: >
    How the phonemic output of the Ancient Greek → Modern Greek laws is written
    in the monotonic orthography (the single-accent system made obligatory for
    public documents in 1982; Horrocks 2010, 175-6).  Greek is an alphabet, so
    this is a letter table; three things in it are conventions rather than
    sounds: the letters of the merged vowels are inherited (η is written η
    although it is pronounced /i/), the digraphs αυ and ευ write /av af ev ef/,
    and the monotonic system writes no breathing and one accent on the stressed
    vowel (the accent itself is placed by the laws, which replace the
    circumflex with the tonos).  A stressed vowel
    therefore has two rules, one for the stressed syllable and one for every
    other, and the accent is written on the vowel, the way the modern system
    does.  A capitalised headword, and a letter this table does not own, is left
    a miss: the layer writes letters, it does not guess them.
  references: [horrocks-2010, smyth-1920]

guard:
  # The reading guard compares the derived form's consonant skeleton and vowel
  # count with the entry's own IPA.  The modern language palatalises the velars
  # before a front vowel, and the IPA writes the palatal allophones ([c ɟ ç ʝ
  # ʎ ɲ]) where the laws write the plain consonant; the two are one phoneme, so
  # the guard folds them.  The table is applied to both sides and never to a
  # rule's output (data/spelling/grc.yaml does the same).
  equivalences:
    c: k
    ɟ: g
    ç: x
    ʝ: ɣ
    ʎ: l
    ɲ: n
    ɾ: r
    # The laws write the velar fricative with the Greek letter χ (the IPA sign
    # for that sound), and the dictionaries write /x/; one segment, two signs.
    χ: x
    # The dictionary's IPA is narrow where the laws are phonemic: a stop is
    # voiced after a nasal (τριάκοντα /triˈakonda/, λάμπω /ˈlam.bo/, the
    # ντ/μπ/γκ of the modern reading), and a nasal is written with the sign of
    # the following consonant (νύμφη /ˈniɱfi/).  The letters are the same either
    # way; only the transcription differs, so the guard folds the two.
    mp: mb
    nt: nd
    nk: ng
    ɱ: m
    ŋ: n

rules:
  - id: au_to_alpha_upsilon
    order: 10
    name: "The sequence /av/ is written αυ"
    match: "a v"
    replace: "αυ"
    tier: orthographic
    description: >
      The digraph αυ writes the sequence the laws write /av/, before a vowel or a voiced consonant (αὐλή → αυλή).
    notes: >
      The laws split the ancient diphthong by the voicing of what follows; the writing does not, so both outcomes are written αυ (Holton, Mackridge & Philippaki-Warburton 1997, 1.2).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "avlˈē", out: "αυλή"}

  - id: af_to_alpha_upsilon
    order: 11
    name: "The sequence /af/ is written αυ"
    match: "a f"
    replace: "αυ"
    tier: orthographic
    description: >
      The same digraph writes the devoiced outcome /af/ before a voiceless consonant (αὐτός → /afˈtos/ → αυτός).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "aftˈos", out: "αυτός"}

  - id: ev_to_epsilon_upsilon
    order: 12
    name: "The sequence /ev/ is written ευ"
    match: "e v"
    replace: "ευ"
    tier: orthographic
    description: >
      The digraph ευ writes /ev/ before a vowel or a voiced consonant (εὐθύς → ευθύς).
    notes: >
      Same convention as αυ: the voicing split is a fact about the sound, not about the letters.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "evθˈēs", out: "ευθής"}

  - id: ef_to_epsilon_upsilon
    order: 13
    name: "The sequence /ef/ is written ευ"
    match: "e f"
    replace: "ευ"
    tier: orthographic
    description: >
      The same digraph writes /ef/ before a voiceless consonant (εὐχή → /efˈçi/ → ευχή).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "efχˈē", out: "ευχή"}

  - id: nasal_before_velar
    order: 20
    name: "A nasal before a velar is written γ"
    match: "n"
    replace: "γ"
    env: {right: "(k|g|x|χ|ɣ)"}
    tier: orthographic
    description: >
      A nasal assimilated to a following velar is written γ, not ν (ἄγκυρα → άγκυρα, ἄγγελος → άγγελος).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "ˈaŋkyra", out: "άγκυρα"}

  - id: ks_to_xi
    order: 25
    name: "/ks/ is written ξ"
    match: "k s"
    replace: "ξ"
    tier: orthographic
    description: >
      The cluster /ks/ is the single sign ξ (ξένος), as in the ancient letter table.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "ksˈenos", out: "ξένος"}

  - id: ps_to_psi
    order: 26
    name: "/ps/ is written ψ"
    match: "p s"
    replace: "ψ"
    tier: orthographic
    description: >
      The cluster /ps/ is the single sign ψ (ψυχή).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "psūχˈē", out: "ψυχή"}

  - id: zd_to_zeta
    order: 27
    name: "/zd/ and /dz/ are written ζ"
    match: "z d"
    replace: "ζ"
    tier: orthographic
    description: >
      ζ writes the cluster /zd/ or /dz/, one sign for two segments.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "zdōˈē", out: "ζωή"}

  - id: final_sigma
    order: 30
    name: "A word-final /s/ is written ς"
    match: "s"
    replace: "ς"
    env: {right: "#"}
    tier: orthographic
    description: >
      A word ends in ς, never in σ (λόγος, not λόγοσ).
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "lˈoɣos", out: "λόγος"}

