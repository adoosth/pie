  - id: secondary_stress_not_written
    order: 89
    name: "A secondary stress is not written"
    match: "ˌ"
    replace: ""
    tier: orthographic
    description: >
      The engine can mark a secondary stress with its own token; Greek writes one accent only, so the token is dropped.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "ˌaloˈos", out: "αλοός"}

  - id: stress_not_written
    order: 90
    name: "The primary stress is the tonos, not a letter"
    match: "ˈ"
    replace: ""
    tier: orthographic
    description: >
      The engine marks stress with its own token before the syllable; the orthography writes it as the tonos on the vowel (the rules above), so the token itself is dropped.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "kalˈos", out: "καλός"}
