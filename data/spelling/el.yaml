    match: "a"
    replace: "ά"
    env: {left: "ˈ"}
    tier: orthographic
    description: >
      A stressed /a/ is written α with the tonos on it; the stress token the laws place before the vowel is not a letter.
    references: [horrocks-2010, smyth-1920]
    examples:
      - {in: "ɣalˈa", out: "γαλά"}

