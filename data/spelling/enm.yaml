stage:
  name: Middle English notation
  description: >
    How this stage is written in the dictionaries the corpus is built from.
    The stage's lemmas carry no macron anywhere in the glossary, so the
    phonemic length mark is a notation the source does not use; mapping it away
    is a comparison convention, not a sound change, and is counted only in the
    orthographic bucket.
  references: [luick-1914]

rules:
  - id: affricate_ch
    order: 9
    name: "The affricate /tʃ/ is written ⟨ch⟩"
    match: "t ʃ"
    replace: "ch"
    tier: orthographic
    description: "Middle English writes the palatal affricate with ch."
    references: [luick-1914]
    examples:
      - {in: "tʃild", out: "child"}

  - id: thorn_out
    order: 10
    name: "The dental fricative is written ⟨th⟩"
    match: θ
    replace: th
    tier: orthographic
    description: "Middle English manuscripts and the dictionary write the dental fricative with th, not with the Old English letters þ and ð."
    references: [luick-1914, dobson-1968]
    examples:
      - {in: "þing", out: "thing"}
  - id: long_open_o
    order: 105
    name: "Long open ⟨ɔ̄⟩ is written ⟨o⟩"
    match: "ɔ̄"
    replace: "o"
    tier: orthographic
    description: "The open long vowel that continues OE *ā is written o in Middle English, the same letter as the reflex of OE *ō; the spelling convention does not distinguish them."
    references: [luick-1914]
    examples:
      - {in: "stɔ̄n", out: "ston"}
  - id: ash_to_a
    order: 99
    name: "⟨æ⟩ is written ⟨a⟩"
    match: "æ"
    replace: "a"
    tier: orthographic
    description: "Middle English writes the reflex of OE short *æ as a (OE cræft > ME craft); the letter æ survives only in a handful of spellings."
    references: [luick-1914]
    examples:
      - {in: "cræft", out: "craft"}

  - id: len_101
    order: 100
    name: "Long ⟨ā⟩ is written ⟨a⟩"
    match: "ā"
    replace: "a"
    tier: orthographic
    description: "The phonemic layer marks vowel length with a macron; this stage's dictionary writes the plain letter and leaves length to context, so the comparison has to be made in the dictionary's notation."
    references: [luick-1914]
    examples:
      - {in: "ām", out: "am"}
  - id: len_113
    order: 101
    name: "Long ⟨ē⟩ is written ⟨e⟩"
    match: "ē"
    replace: "e"
    tier: orthographic
    description: "The phonemic layer marks vowel length with a macron; this stage's dictionary writes the plain letter and leaves length to context, so the comparison has to be made in the dictionary's notation."
    references: [luick-1914]
    examples:
      - {in: "ēm", out: "em"}
