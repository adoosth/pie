- id: palatal_n_geminate
  order: 430
  name: '*ňň > ιν'
  match: ň ň
  replace: i n
  tier: established
  references:
  - sihler-1995
  examples:
  - in: '*pʰáňňō'
    out: '*pʰáinō'
