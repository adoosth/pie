  mul-tax: {name: Translingual (taxonomy), family: Translingual}

  # Sister branches a dictionary's mark may name (2026-11-10).  Dehkhoda marks
  # French, Russian and English loans in modern Persian, and every one of them
  # is inside the family — a loan from a sister branch, never "unexplained".
  fr: {name: French, family: Romance}
  es: {name: Spanish, family: Romance}
  ro: {name: Romanian, family: Romance}
  ru: {name: Russian, family: Slavic}
  pl: {name: Polish, family: Slavic}
  cs: {name: Czech, family: Slavic}
  bg: {name: Bulgarian, family: Slavic}
  sr: {name: Serbian, family: Slavic}
  nl: {name: Dutch, family: Germanic}
  da: {name: Danish, family: Germanic}
  sv: {name: Swedish, family: Germanic}
  hi: {name: Hindi, family: Indo-Aryan}
  ur: {name: Urdu, family: Indo-Aryan}
  ku: {name: Kurdish, family: Iranian}

  # Codes the full Wiktionary table does not define, met in the lexicons
  # (2026-11-12).
  bkk: {name: Brokskat, family: Indo-Iranian}
  enm-esc: {name: Early Scots, family: Germanic}
  ms-old: {name: Old Malay, family: Austronesian}
  sio-pro: {name: Proto-Siouan, family: Siouan}
